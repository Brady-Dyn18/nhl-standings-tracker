name: Daily NHL standings

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional UTC date for a real NHL historical snapshot"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Fetch and build standings
        run: |
          if [ -n "$RUN_DATE" ]; then
            uv run python pipeline.py --date "$RUN_DATE"
          else
            uv run python pipeline.py
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_DATE: ${{ inputs.run_date }}
      - run: uv run --group dev pytest -q
      - name: Commit daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history.csv data/status.json
          git diff --cached --quiet || git commit -m "Update NHL standings for $(date -u +%F)"
          git push
